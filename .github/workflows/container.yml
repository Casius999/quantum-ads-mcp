name: Container
# Builds the remote image whenever its inputs change, and checks the entrypoint starts.
on:
  pull_request:
    paths: [Dockerfile, .dockerignore, pyproject.toml, uv.lock]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t quantum-ads-mcp:ci .
      - name: Entrypoint answers and refuses to serve HTTP unauthenticated
        run: |
          docker run --rm quantum-ads-mcp:ci --help
          if docker run --rm quantum-ads-mcp:ci serve --transport http; then
            echo "served without any auth configuration" && exit 1
          fi
